name: Parhelion Studio Co.
description: 'Parhelion Studio Co. is an anime-focused game studio based in Ann Arbor,
  Michigan, and a portfolio company of a16z (Speedrun Cohort 002). Founded by a team
  that met at the University of Michigan, the studio builds live-service anime mobile
  and PC games — including gacha titles and the tactical anime trading card game Echoes
  of Astra — publishing across Steam, the Apple App Store, and Google Play. Their
  mission is to make anime a global medium and to create long-lasting IP through games
  and technology. Parhelion Studio is a consumer entertainment company; a public,
  scan of its website (parhelion.gg), app-store listings, and the a16z Speedrun profile
  found no developer-facing API, SDK, MCP server, webhook, or other machine-readable
  API surface. This profile was added to the API Evangelist network as an a16z portfolio
  lead and enriched to confirm it has no public API program at this time.'
